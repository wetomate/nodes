name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Build, lint, and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate community node packages
        run: npm run check:packages

      - name: Build packages
        run: npm run build

      - name: Lint packages
        run: npm run lint

      - name: Test packages
        run: npm test

      - name: Check toolkit package contents
        working-directory: wetomate-node-toolkit
        run: npm pack --dry-run

      - name: Check Duo package contents
        working-directory: n8n-nodes-duo
        run: npm pack --dry-run
